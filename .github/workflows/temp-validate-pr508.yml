name: Temporary validate PR 508 rebase

on:
  push:
    branches:
      - validate/pr508-rebase-20260928
    paths:
      - '.github/workflows/temp-validate-pr508.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Targeted integration-cleanup tests
        run: pytest test/test_make_integration.py -v
      - name: Ruff targeted
        run: ruff check test/test_make_integration.py
      - name: Makefile dry-run
        run: make -n integration
